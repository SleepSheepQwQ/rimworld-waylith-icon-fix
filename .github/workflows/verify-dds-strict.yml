name: verify-dds-strict

on:
  push:
    paths:
      - 'mod/Source/DdsPrefixAlt.cs'
      - 'mod/Source/DdsFormatFix.cs'
      - 'mod/Source/ShadowFix.cs'
      - 'ci/regression/dds/**'
      - '.github/workflows/verify-dds-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-dds-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: glyphfix
      - uses: actions/checkout@v4
        with:
          repository: SleepSheepQwQ/rimworld-waylith-re
          path: .waylith-host
          token: ${{ github.token }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libstb-dev
          python3 -m pip install --break-system-packages --quiet pillow
      - name: Build host, probe and current mod
        run: |
          set -euo pipefail
          dotnet build .waylith-host/ci/apphost/RimWorld.csproj -c Release -v minimal
          dotnet build .waylith-host/ddsfix/DdsFixProbe.csproj -c Release -v minimal
          dotnet build glyphfix/mod/AgentTouchFix.csproj -c Release -v minimal
      - name: Assemble host, leak fixtures and strict DDS mod
        run: |
          set -euo pipefail
          mkdir -p out
          (
            cd .waylith-host
            bash ci/assemble.sh "$GITHUB_WORKSPACE/run"
          ) 2>&1 | tee out/assemble.log
          python3 .waylith-host/ci/make_leak_mod.py --run "$GITHUB_WORKSPACE/run" | tee out/leak.txt
          python3 .waylith-host/ci/make_multimod.py \
            --run "$GITHUB_WORKSPACE/run" \
            --source "$GITHUB_WORKSPACE/.waylith-host/game/Resources/Textures" | tee out/multi.txt
          python3 glyphfix/ci/regression/dds/make_fixtures.py \
            --run "$GITHUB_WORKSPACE/run" --host "$GITHUB_WORKSPACE/.waylith-host" | tee out/dds-fixtures.txt

          mkdir -p run/Mods/glyphfix/About run/Mods/glyphfix/Assemblies
          cp glyphfix/mod/About/About.xml run/Mods/glyphfix/About/
          cp glyphfix/mod/bin/Release/net10.0/GlyphFix.dll run/Mods/glyphfix/Assemblies/
          sha256sum run/Mods/glyphfix/Assemblies/GlyphFix.dll | tee out/dll.txt
      - name: "Control: strict DDS fixtures without GlyphFix"
        run: |
          set -uo pipefail
          CFG="$HOME/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"
          mkdir -p "$CFG"
          python3 - "$GITHUB_WORKSPACE/.waylith-host/ci/ModsConfig.leak.xml" "$CFG/ModsConfig.xml" <<'PY'
          import sys
          src, dst = sys.argv[1:]
          text = open(src, encoding="utf-8").read()
          marker = "<li>waylith.leakrepro</li>"
          text = text.replace(marker, marker + "\n    <li>waylith.multileak</li>\n    <li>waylith.ddsstrict</li>", 1)
          open(dst, "w", encoding="utf-8").write(text)
          print(text)
          PY
          (
            cd run
            DOTNET_STARTUP_HOOKS="$GITHUB_WORKSPACE/.waylith-host/ddsfix/bin/Release/net10.0/DdsFixProbe.dll" \
            MODCHECK_DEF=Gun_Revolver_LeakExt MODCHECK_DDS=1 PROBE_TIMEOUT_MS=180000 \
            timeout 240 ./RimWorld -Headless -SuppressUnityStubs -DisableLogStackTraces
          ) > out/control.log 2>&1
          echo $? > out/control.exit
          grep -aE '^\[MODCHECK\]|^\[AgentTouchFix\]' out/control.log | tee out/control.txt || true
          exit 0
      - name: "Patched: current GlyphFix"
        run: |
          set -uo pipefail
          CFG="$HOME/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"
          python3 - "$GITHUB_WORKSPACE/.waylith-host/ci/ModsConfig.leak.xml" "$CFG/ModsConfig.xml" <<'PY'
          import sys
          src, dst = sys.argv[1:]
          text = open(src, encoding="utf-8").read()
          marker = "<li>waylith.leakrepro</li>"
          text = text.replace(marker, marker + "\n    <li>waylith.multileak</li>\n    <li>waylith.ddsstrict</li>\n    <li>sleepsheep.waylith.glyphfix</li>", 1)
          open(dst, "w", encoding="utf-8").write(text)
          print(text)
          PY
          (
            cd run
            DOTNET_STARTUP_HOOKS="$GITHUB_WORKSPACE/.waylith-host/ddsfix/bin/Release/net10.0/DdsFixProbe.dll" \
            MODCHECK_DEF=Gun_Revolver_LeakExt MODCHECK_DDS=1 PROBE_TIMEOUT_MS=180000 \
            timeout 240 ./RimWorld -Headless -SuppressUnityStubs -DisableLogStackTraces
          ) > out/patched.log 2>&1
          echo $? > out/patched.exit
          grep -aE '^\[MODCHECK\]|^\[AgentTouchFix\]' out/patched.log | tee out/patched.txt || true
          exit 0
      - name: Gate
        run: |
          set -euo pipefail
          python3 glyphfix/ci/regression/dds/gate.py out/control.txt out/patched.txt \
            --control-exit "$(cat out/control.exit)" \
            --patched-exit "$(cat out/patched.exit)" \
            --summary out/summary.md
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Strict DDS/PNG verification"
            echo
            cat out/summary.md 2>/dev/null || true
            echo
            echo '```'
            grep -aE '^\[MODCHECK\] dds|^\[MODCHECK\] case|^\[AgentTouchFix\].*dds|^\[AgentTouchFix\].*shadow' \
              out/patched.txt 2>/dev/null | tail -n 100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dds-strict-${{ github.run_id }}
          path: out/**
          if-no-files-found: warn
