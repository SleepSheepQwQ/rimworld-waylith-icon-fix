name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests (shader math + icon routing)
        run: dotnet test tests/TexSt/TexSt.csproj -c Release -v minimal

      - name: Build the mod (with a unique build stamp)
        run: |
          STAMP=$(date -u +%Y%m%d%H%M%SZ)
          echo "build stamp: $STAMP"
          echo "BUILD_STAMP=$STAMP" >> "$GITHUB_ENV"
          dotnet build mod/AgentTouchFix.csproj -c Release -v minimal -p:BuildStamp="$STAMP"

      - name: Probe smoke test (runs the real entry point, checks the log contract)
        run: dotnet run --project tests/Smoke/Smoke.csproj -c Release -v minimal -p:BuildStamp="$BUILD_STAMP"

      - name: Package
        run: |
          DLL=$(find mod/bin/Release -name AgentTouchFix.dll | head -1)
          test -n "$DLL" || { echo "AgentTouchFix.dll not found"; exit 1; }
          mkdir -p dist/AgentTouchFix/Assemblies
          cp mod/About/About.xml dist/AgentTouchFix/
          cp "$DLL" dist/AgentTouchFix/Assemblies/
          cd dist && zip -qr ../AgentTouchFix.zip AgentTouchFix
          cd ..
          echo "--- probe wiring checks (the DLL must carry the probe, not just the repo) ---"
          # string literals live in the metadata heap as UTF-16, the AssemblyMetadata stamp as UTF-8
          chk() { strings -el "$DLL" 2>/dev/null | grep -q -e "$1" || grep -a -q -e "$1" "$DLL"; }
          chk "drawprobe.log"           || { echo "FAIL: drawprobe.log name missing from DLL"; exit 1; }
          chk "SHADERDB"                || { echo "FAIL: ShaderDatabase dump missing from DLL"; exit 1; }
          chk "DrawTextureWithTexCoords" || { echo "FAIL: draw attempts missing from DLL"; exit 1; }
          chk "DrawTexture+Material"    || { echo "FAIL: material draw attempt missing from DLL"; exit 1; }
          grep -a -q "$BUILD_STAMP" "$DLL" || { echo "FAIL: build stamp $BUILD_STAMP missing from DLL"; exit 1; }
          echo "--- artifact hashes ---"
          md5sum "$DLL" AgentTouchFix.zip | tee /tmp/hashes.txt
          stat -c '%n %s bytes' "$DLL" | tee -a /tmp/hashes.txt
          {
            echo "### build $BUILD_STAMP"
            echo '```'
            cat /tmp/hashes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: AgentTouchFix
          path: AgentTouchFix.zip
