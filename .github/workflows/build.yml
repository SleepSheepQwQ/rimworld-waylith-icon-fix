name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests (shader math + icon routing)
        run: dotnet test tests/TexSt/TexSt.csproj -c Release -v minimal

      - name: Build the mod
        run: dotnet build mod/AgentTouchFix.csproj -c Release -v minimal

      - name: Prefix benchmark (old logic vs fast path, 1e6 calls per case)
        run: dotnet run --project tests/Bench/Bench.csproj -c Release -v minimal

      - name: Package
        run: |
          echo "--- produced ---"
          find mod/bin/Release -name '*.dll' -printf '%p %s bytes\n' | sort
          DLL=$(find mod/bin/Release -name '*.dll' ! -name '0Harmony.dll' ! -name 'Lib.Harmony.dll' | head -1)
          test -n "$DLL" || { echo "no mod dll produced"; exit 1; }
          mkdir -p dist/GlyphFix/About dist/GlyphFix/Assemblies
          cp mod/About/About.xml dist/GlyphFix/About/
          cp "$DLL" dist/GlyphFix/Assemblies/
          (cd dist/GlyphFix && zip -qr ../../GlyphFix.zip .)
          echo "--- artifact ---"
          md5sum "$DLL" GlyphFix.zip
          stat -c '%n %s bytes' "$DLL" GlyphFix.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GlyphFix
          path: GlyphFix.zip
