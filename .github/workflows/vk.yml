name: vk-repro

# Renders the CutoutComplexUI material path on software Vulkan (lavapipe) with the real shader.
# Synthetic textures, so nothing from the game is redistributed.

on:
  push:
    paths:
      - 'vk/**'
      - '.github/workflows/vk.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan + shader tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev vulkan-tools mesa-vulkan-drivers glslang-tools

      - name: Find the software ICD
        run: |
          ICD=$(find /usr -name 'lvp_icd*.json' 2>/dev/null | head -1)
          echo "found ICD: ${ICD:-none}"
          echo "ICD=$ICD" >> "$GITHUB_ENV"

      - name: Compile shaders
        run: |
          mkdir -p build
          glslangValidator -V vk/quad.vert -o build/quad.spv
          glslangValidator -V vk/CutoutComplex.frag.glsl -o build/frag.spv

      - name: Build harness
        run: gcc -O2 -std=c11 -Wall -o build/harness vk/harness.c -lvulkan -lm

      - name: Render the icon-material cases
        run: |
          if [ -n "${ICD:-}" ]; then export VK_ICD_FILENAMES="$ICD"; fi
          bash vk/run_cases.sh build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: build/*.ppm
          if-no-files-found: ignore
